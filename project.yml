name: MtechApp
options:
  bundleIdPrefix: com.mtech
  deploymentTarget:
    iOS: "16.0"
targets:
  MtechApp:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - target: MtechWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtech.app
        PRODUCT_NAME: MtechApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mtech
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
  MtechWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: Mtech Widget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtech.app.widget
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
